name: lineready

services:
  db:
    image: pgvector/pgvector:pg16   # server: deploy/postgres/Dockerfile (Alpine, smaller)
    environment:
      POSTGRES_USER: lineready
      POSTGRES_PASSWORD: lineready
      POSTGRES_DB: lineready
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_wal_size=256MB", "-c", "min_wal_size=64MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineready"]
      interval: 3s
      retries: 20

  app:
    build:
      context: .
      target: build          # laptop/dev image: parsers + embedding model; the server uses the runtime target
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://lineready:lineready@db:5432/lineready
      DATA_CORE: /data/core
      DATA_SUPP: /data/supp
      CACHE_DIR: /app/var
    volumes:
      - ./:/app
      - "${DATA_CORE_DIR:-../01 Core}:/data/core:ro"
      - "${DATA_SUPP_DIR:-../02 Supplementary}:/data/supp:ro"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Local development: code mounted from disk, auto-reload. Root only because ./var on the host
    # was created by root; the production image runs as uid 10001.
    user: root
    command: uvicorn lineready.interfaces.api:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    environment:
      LINEREADY_API_URL: http://app:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - app

volumes:
  pgdata:
