apiVersion: v1
kind: Service
metadata:
  name: lineready-web
spec:
  selector: { app.kubernetes.io/name: lineready-web }
  ports: [{ name: http, port: 80, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lineready-web
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: lineready-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lineready-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: lineready-web
          ports: [{ containerPort: 3000, name: http }]
          env:
            - { name: LINEREADY_API_URL, value: "http://lineready-api:8000" }
          readinessProbe:
            httpGet: { path: /backend/healthz, port: http }   # also proves the API is reachable
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: cache, mountPath: /app/.next/cache }
      volumes:
        - name: cache
          emptyDir: {}
