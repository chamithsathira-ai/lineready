# DO NOT COMMIT REAL VALUES. Create the secret from the command line instead (deploy/README.md):
#   kubectl -n lineready create secret generic lineready-secrets \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=DATABASE_URL='postgresql://lineready:...@lineready-db:5432/lineready' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...'
apiVersion: v1
kind: Secret
metadata:
  name: lineready-secrets
  namespace: lineready
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql://lineready:change-me@lineready-db:5432/lineready
  ANTHROPIC_API_KEY: ""
