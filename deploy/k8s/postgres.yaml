# Postgres 16 (Alpine) + pgvector, built from deploy/postgres/Dockerfile (~400 MB image).
# Sized for a 2 GB disk: the knowledge base restores to ~460 MB; WAL is capped so the volume stays < 1 GiB.
apiVersion: v1
kind: Service
metadata:
  name: lineready-db
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: lineready-db }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lineready-db
spec:
  serviceName: lineready-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: lineready-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lineready-db }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # postgres user in the official image
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: lineready-db
          args: ["-c", "max_wal_size=256MB", "-c", "min_wal_size=64MB", "-c", "shared_buffers=128MB",
                 "-c", "work_mem=8MB", "-c", "maintenance_work_mem=64MB"]
          env:
            - { name: POSTGRES_USER, value: lineready }
            - { name: POSTGRES_DB, value: lineready }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: lineready-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432, name: postgres }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "lineready"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "lineready"] }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
